name: SipClient
options:
  bundleIdPrefix: com.yepher
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # Stamps LastUpgradeCheck so Xcode stops offering "Update to recommended
  # settings". Bump it — and fold any newly recommended settings into
  # `settings.base` below — when moving to a new Xcode.
  xcodeVersion: "26.6"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    # Xcode's recommended settings (the "Update to recommended settings"
    # check). Set here because anything changed in Xcode's UI is lost on
    # the next `xcodegen generate`.
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

# Sparkle powers in-app auto-update. This MUST stay declared here rather
# than being added through Xcode's UI: project.yml regenerates the
# project, so anything added only in Xcode is silently dropped on the
# next `xcodegen generate` — which is how the dependency, and every
# SU* key below, went missing before 0.1.0-b11.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.1

targets:
  SipClient:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Sources
        excludes:
          # Added by its own entry below so it can carry compiler flags.
          - "RTP/AMRWB/vendor"
      # Vendored AMR-WB encoder. Built with warnings off: it is upstream
      # code we deliberately don't edit (see VENDORED.md), so its
      # 64-bit-narrowing and doc-comment warnings are noise we can't fix.
      - path: Sources/RTP/AMRWB/vendor
        compilerFlags: "-w"
        excludes:
          # Lookup tables #include'd by the C sources. They are found via
          # HEADER_SEARCH_PATHS; keeping them out of the project stops
          # Xcode copying them into the app bundle.
          - "**/*.tab"
          - "VENDORED.md"
          # Shipped as resources by the entries below.
          - "LICENSE-vo-amrwbenc.txt"
          - "NOTICE-vo-amrwbenc.txt"
      # Apache-2.0 §4(a) requires the licence and NOTICE to travel with
      # any binary distribution of vo-amrwbenc, so they ship in the bundle.
      - path: Sources/RTP/AMRWB/vendor/LICENSE-vo-amrwbenc.txt
        buildPhase: resources
      - path: Sources/RTP/AMRWB/vendor/NOTICE-vo-amrwbenc.txt
        buildPhase: resources
    resources:
      - path: Resources
        optional: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: SipClient
        CFBundleDisplayName: SIP Client
        # Must resolve through the build setting, not be hardcoded — the
        # .sipcall UTI below is namespaced under this identifier and
        # existing installs update in place only if it stays stable.
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "0.1.0-b11"
        CFBundleVersion: "36"
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSMicrophoneUsageDescription: "SIP Client needs microphone access to send audio during SIP calls."
        NSLocalNetworkUsageDescription: "SIP Client communicates with SIP servers and STUN servers on your local network."
        NSBonjourServices:
          - _sip._udp
        # Sparkle auto-update. SUPublicEDKey pairs with the private key at
        # ~/.config/sipclient-sparkle.key and MUST NOT be rotated — builds
        # already in users' hands refuse updates signed with another key.
        SUFeedURL: "https://raw.githubusercontent.com/yepher/SipClient/main/appcast.xml"
        SUPublicEDKey: "xMeOWJTJ1RR9l+fHmScEm89mvi302Io6oBl7q8QDLls="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # Double-clicking a .sipcall profile in Finder opens it here.
        CFBundleDocumentTypes:
          - CFBundleTypeName: SIP Client Profile
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.yepher.sipclient.sipcall
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.yepher.sipclient.sipcall
            UTTypeDescription: SIP Client Profile
            UTTypeConformsTo:
              - public.json
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - sipcall
              public.mime-type:
                - application/x-sipcall
    entitlements:
      path: Sources/SipClient.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yepher.sipclient
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/SipClient.entitlements
        # Vendored AMR-WB encoder (vo-amrwbenc) compiled into the target.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/SipClient-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Sources/RTP/AMRWB/vendor
          - $(SRCROOT)/Sources/RTP/AMRWB/vendor/amrwbenc/inc
          - $(SRCROOT)/Sources/RTP/AMRWB/vendor/common/include
